<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>From Zero to Hero - Book Cover</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #090d16;
      color: #fff;
      display: flex;
      justify-content: center;
      padding: 36px 20px;
    }

    .book-cover-page {
      width: 100%;
      max-width: 720px;
      aspect-ratio: 210 / 297;
      border-radius: 22px;
      padding: 52px 44px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.35);
      background: #0b132b;
    }

    .banner-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .scrim-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(8, 15, 35, 0.88) 0%,
        rgba(8, 15, 35, 0.45) 28%,
        rgba(8, 15, 35, 0.05) 55%,
        rgba(8, 15, 35, 0.25) 100%
      );
    }

    .book-title {
      position: relative;
      z-index: 2;
      font-size: 3.8rem;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -1.5px;
      color: #ffffff;
      text-shadow: 0 8px 30px rgba(0, 0, 0, 0.65), 0 0 40px rgba(56, 189, 248, 0.35);
    }
  </style>
</head>
<body>

  <div class="book-cover-page">
    <img class="banner-bg" src="book_cover_banner.jpg" alt="From Zero to Hero Curriculum Cover">
    <div class="scrim-overlay"></div>
    <h1 class="book-title">From Zero to Hero</h1>
  </div>

</body>
</html>
