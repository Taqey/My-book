<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson 2 Cover - Neural Networks & Deep Learning</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', 'Cairo', sans-serif;
      background: #090d16;
      color: #fff;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
    }
    .lesson-cover-page {
      width: 100%;
      max-width: 720px;
      aspect-ratio: 210 / 297;
      border-radius: 22px;
      padding: 40px 38px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: #0b132b;
    }
    .banner-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 36px 36px;
      z-index: 0;
      pointer-events: none;
    }
    .v6-scrim {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(8, 15, 35, 0.92) 0%,
        rgba(8, 15, 35, 0.65) 36%,
        rgba(8, 15, 35, 0.08) 65%,
        rgba(8, 15, 35, 0.25) 100%
      );
    }
    .unit-pill {
      position: relative;
      z-index: 2;
      align-self: flex-start;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.28);
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #f1f5f9;
    }
    .v6-hero {
      position: relative;
      z-index: 2;
      margin-top: 24px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: start;
    }
    .v6-text-col {
      min-width: 0;
    }
    .v6-watermark {
      font-size: 7.5rem;
      font-weight: 900;
      line-height: 0.85;
      color: transparent;
      pointer-events: none;
      user-select: none;
      padding-top: 4px;
    }
    .v6-num {
      position: relative;
      z-index: 1;
      font-size: 1.2rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 6px;
    }
    .v6-title {
      position: relative;
      z-index: 1;
      font-size: 2.55rem;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 14px;
      color: #fff;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
    }
    .v6-sub {
      position: relative;
      z-index: 1;
      font-size: 0.96rem;
      line-height: 1.55;
      color: #e2e8f0;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }
</style>
</head>
<body>
  
    <div class="lesson-cover-page" style="background: linear-gradient(145deg, #064e3b 0%, #0f766e 55%, #2563eb 100%);">
      <div class="grid-overlay"></div>
      <div class="v6-scrim"></div>
      <span class="unit-pill">Unit 7 • Machine Learning & AI</span>
      <div class="v6-hero">
        <div class="v6-text-col">
          <div class="v6-num" style="color: #34d399;">Lesson 2</div>
          <h2 class="v6-title">Neural Networks & Deep Learning</h2>
          <p class="v6-sub">Step inside artificial neurons, hidden layers, and backpropagation to see how deep learning powers computer vision and speech.</p>
        </div>
        <div class="v6-watermark" style="-webkit-text-stroke: 2px #34d39966;">02</div>
      </div>
    </div>
    
</body>
</html>
